version: '3.8'

services:
  voice-control:
    build:
      context: .
      dockerfile: Dockerfile.${ARCH:-amd64}
    container_name: voice-control
    environment:
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    volumes:
      - ./config.json:/app/config.json:ro
      - ./devices.json:/app/devices.json:ro
      - /run/user/1000/pulse:/run/user/1000/pulse
      - /dev/snd:/dev/snd
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    restart: unless-stopped
    # Mode interactif (avec wake word)
    command: ["python", "voice_control.py", "--mode", "interactive"]

  # Mode test (CLI texte uniquement)
  voice-control-test:
    build:
      context: .
      dockerfile: Dockerfile.${ARCH:-amd64}
    container_name: voice-control-test
    volumes:
      - ./config.json:/app/config.json:ro
      - ./devices.json:/app/devices.json:ro
    stdin_open: true
    tty: true
    command: ["python", "voice_control.py", "--mode", "test"]